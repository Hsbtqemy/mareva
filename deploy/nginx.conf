# Exemple de configuration Nginx (reverse proxy vers Gunicorn).
# Adapter le domaine et les chemins absolus, puis :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/etude
#   sudo ln -s /etc/nginx/sites-available/etude /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis activer HTTPS :  sudo certbot --nginx -d mon-domaine.fr
# (certbot ajoutera automatiquement le bloc d'écoute 443 + la redirection.)

server {
    listen 80;
    server_name mon-domaine.fr www.mon-domaine.fr;

    # Téléversements de médias jusqu'à ~1 Go (sinon refusé au-delà de ~1 Mo).
    client_max_body_size 1024m;

    # Fichiers statiques de l'admin (générés par `manage.py collectstatic`).
    location /static/ {
        alias /chemin/absolu/vers/le-projet/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Médias PROTÉGÉS : zone interne, atteignable uniquement via le header
    # X-Accel-Redirect renvoyé par Django (jamais accessible directement).
    location /media-protege/ {
        internal;
        alias /chemin/absolu/vers/le-projet/media/;
    }

    # Tout le reste → application (Gunicorn).
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Indispensable pour que la limitation anti-flood voie la vraie IP :
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
