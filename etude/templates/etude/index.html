{% extends "etude/base.html" %}
{% block titre %}{{ config.titre_accueil }}{% endblock %}
{% block contenu %}
  <p class="eyebrow">{{ config.nom_etude }}</p>
  <h1>{{ config.titre_accueil }}</h1>
  <div class="intro">{{ config.description|linebreaksbr }}</div>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="bouton">{{ config.bouton_consentement }}</button>
  </form>
{% endblock %}
