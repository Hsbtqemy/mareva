{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{{ config.nom_etude }}{% endblock %}</title>
  <script>/* applique un choix explicite avant peinture ; sinon l'appareil décide (CSS) */(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
    /* Direction : laboratoire calme. La vidéo est l'unique foyer d'attention ;
       tout le reste est neutre et silencieux pour ne pas biaiser le jugement.
       Palette froide et basse en saturation ; rien qui attire l'œil hors du clip. */
    :root {
      --fond: #14171c;        /* gris-bleu très sombre, repos visuel */
      --surface: #1d2127;
      --bord: #2c323b;
      --texte: #e6e8ec;
      --texte-doux: #9aa3af;
      --accent: #6ea8c4;      /* bleu froid désaturé, utilisé avec parcimonie */
      --accent-fonce: #4f8aa6;
      --erreur: #c98b8b;
      --rayon: 10px;
    }
    /* Par défaut : suit l'appareil. Un choix explicite (data-theme) surcharge. */
    @media (prefers-color-scheme: light) {
      :root {
        --fond: #f4f6f8; --surface: #ffffff; --bord: #d3dae1; --texte: #1c2127;
        --texte-doux: #5b6675; --accent: #3a7d99; --accent-fonce: #336e88; --erreur: #b04a4a;
      }
    }
    :root[data-theme="light"] {
      --fond: #f4f6f8; --surface: #ffffff; --bord: #d3dae1; --texte: #1c2127;
      --texte-doux: #5b6675; --accent: #3a7d99; --accent-fonce: #336e88; --erreur: #b04a4a;
    }
    :root[data-theme="dark"] {
      --fond: #14171c; --surface: #1d2127; --bord: #2c323b; --texte: #e6e8ec;
      --texte-doux: #9aa3af; --accent: #6ea8c4; --accent-fonce: #4f8aa6; --erreur: #c98b8b;
    }
    .theme-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 50;
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--bord); background: var(--surface); color: var(--texte);
      cursor: pointer; font-size: 16px; line-height: 1; padding: 0;
    }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .cadre {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--texte-doux);
      margin: 0 0 8px;
    }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 16px; letter-spacing: -0.01em; }
    p { color: var(--texte-doux); }
    p.intro { color: var(--texte); }
    .bouton {
      appearance: none; border: 0; cursor: pointer;
      background: var(--accent-fonce); color: #fff;
      font-size: 15px; font-weight: 600;
      padding: 12px 22px; border-radius: var(--rayon);
      transition: background .15s ease;
    }
    .bouton:hover { background: var(--accent); }
    .bouton:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bouton.secondaire {
      background: transparent; color: var(--texte-doux);
      border: 1px solid var(--bord);
    }
    .bouton.secondaire:hover { color: var(--texte); border-color: var(--texte-doux); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .erreur {
      background: rgba(201,139,139,.12); border: 1px solid var(--erreur);
      color: var(--erreur); padding: 12px 16px; border-radius: var(--rayon);
      margin-bottom: 20px; font-size: 14px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" title="Thème clair / sombre" aria-label="Basculer le thème clair ou sombre"><span class="t-icon">🌙</span></button>
  <main class="cadre">
    {% block contenu %}{% endblock %}
  </main>
  <script>
    (function(){
      var b = document.getElementById('theme-toggle'); if(!b) return;
      var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
      function eff(){ var a = document.documentElement.getAttribute('data-theme'); return a || ((mq && mq.matches) ? 'light' : 'dark'); }
      function maj(){ b.querySelector('.t-icon').textContent = eff()==='light' ? '☀️' : '🌙'; }
      maj();
      b.addEventListener('click', function(){
        var t = eff()==='light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem('theme', t); } catch(e){}
        maj();
      });
      if (mq && mq.addEventListener) mq.addEventListener('change', maj);
    })();
  </script>
</body>
</html>
